# MILLIYBIZ.NEWS: site (/), CRM (/admin), API (/api), photos (/uploads).
# Service: milliybiz-news (127.0.0.1:4200). Folder: /srv/projects/milliybiz-news
server {
    listen 80;
    server_name news.milliybiz.uz;
    location ^~ /.well-known/acme-challenge/ { root /srv/projects/milliybiz-news/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name news.milliybiz.uz;

    ssl_certificate     /etc/letsencrypt/live/news.milliybiz.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.milliybiz.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # photos uploaded from the CRM
    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ { root /srv/projects/milliybiz-news/acme; }

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
