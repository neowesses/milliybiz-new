# MILLIYBIZ.NEWS (before HTTPS). Service: milliybiz-news (127.0.0.1:4200). Folder: /srv/projects/milliybiz-news
server {
    listen 80;
    server_name news.milliybiz.uz;
    client_max_body_size 25m;
    location ^~ /.well-known/acme-challenge/ { root /srv/projects/milliybiz-news/acme; }
    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
